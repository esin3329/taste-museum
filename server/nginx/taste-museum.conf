# Mount this file as /etc/nginx/conf.d/taste-museum.conf in the existing Nginx
# container. The Node.js service name below must match the existing container
# network name.

upstream taste_museum_api {
    server museum-api:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the Node.js upload limit (25 MiB). Node.js still enforces the
    # exact request limit and validates the multipart image content.
    client_max_body_size 25m;

    # Built assets can be cached by the browser because Vite fingerprints them.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The application owns uploaded files and protects their paths. Keep this
    # route behind Node.js instead of exposing the whole data directory.
    location /uploads/ {
        proxy_pass http://taste_museum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON and multipart requests go to the Node.js application server.
    location /api/ {
        proxy_pass http://taste_museum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React history fallback for lobby, map, room and collection routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
