# Install as /etc/nginx/sites-available/taste-museum and enable it.
# Nginx owns the public web entry point. Node.js remains private on 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/taste-museum/dist/client;
    index index.html;

    # Match the Node.js upload limit (25 MiB). Node.js still enforces the
    # exact request limit and validates the multipart image content.
    client_max_body_size 25m;

    # Built assets can be cached by the browser because Vite fingerprints them.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The application owns uploaded files and protects their paths. Keep this
    # route behind Node.js instead of exposing the whole data directory.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON and multipart requests go to the Node.js application server.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React history fallback for lobby, map, room and collection routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
